<style>
  :root{
    --navy:#0E1A30;
    --navy-soft:#16233D;
    --cream:#F1EAE0;
    --white:#FDFAF5;
    --ink:#2B2820;
    --muted:#6B665A;
    --gold:#C6963F;
    --gold-dark:#A87B31;
    --line:rgba(14,26,48,0.12);
    --line-on-dark:rgba(255,255,255,0.14);
    --serif:'Fraunces', serif;
    --sans:'Inter', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--sans); color:var(--ink); background:var(--cream); font-size:15px;}
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  h1,h2,h3{font-family:var(--serif); font-weight:400; line-height:1.08;}
  em, i{font-style:italic; color:var(--gold-dark);}
  .wrap{max-width:1180px; margin:0 auto; padding:0 40px;}
  .eyebrow{
    font-family:var(--mono); font-size:0.68rem; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--gold-dark); margin-bottom:14px;
  }
  .eyebrow.on-dark{color:var(--gold);}
  section{position:relative;}
  .btn{
    font-family:var(--mono); font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase;
    padding:15px 26px; display:inline-block; border-radius:1px;
  }
  .btn.solid{background:var(--navy); color:var(--white);}
  .btn.outline{border:1px solid var(--navy); color:var(--navy);}
  .btn.outline.on-dark{border-color:rgba(255,255,255,0.5); color:var(--white);}
  .btn.pill{border-radius:30px;}

  /* ===== Utility bar ===== */
  .utility{
    background:var(--navy); color:rgba(255,255,255,0.75);
    display:flex; justify-content:space-between; padding:9px 40px;
    font-family:var(--mono); font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase;
  }

  /* ===== Nav ===== */
  .nav{
    background:var(--white); display:flex; align-items:center; justify-content:space-between;
    padding:22px 40px; border-bottom:1px solid var(--line);
  }
  .brandmark{display:flex; align-items:baseline; gap:8px;}
  .brandmark .name{font-family:var(--serif); font-size:1.5rem; letter-spacing:0.02em;}
  .brandmark small{font-family:var(--mono); font-size:0.55rem; letter-spacing:0.16em; color:var(--muted); text-transform:uppercase;}
  .nav__links{display:flex; gap:28px; font-size:0.78rem; color:var(--ink);}
  .nav__links a{opacity:0.75;}
  .nav__links a:hover{opacity:1;}
  .nav__cta{font-size:0.66rem; letter-spacing:0.08em; text-transform:uppercase; border:1px solid var(--navy); padding:10px 20px; border-radius:30px;}

  /* ===== Hero ===== */
  .hero{padding:64px 0 0;}
  .hero-grid{display:grid; grid-template-columns:0.85fr 1.15fr; gap:60px; align-items:start;}
  .hero-copy .eyebrow{margin-bottom:22px;}
  .hero h1{font-size:clamp(2.6rem,5vw,3.8rem); margin-bottom:22px;}
  .hero p{color:var(--muted); line-height:1.7; max-width:420px; margin-bottom:34px;}
  .hero__ctas{display:flex; gap:14px; margin-bottom:46px;}
  .hero-stats{display:flex; gap:0;}
  .hstat{padding-right:26px; margin-right:26px; border-right:1px solid var(--line);}
  .hstat:last-child{border-right:none;}
  .hstat b{font-family:var(--serif); font-size:1.5rem; display:block;}
  .hstat span{font-family:var(--mono); font-size:0.6rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted);}
  .hero-img-wrap{position:relative;}
